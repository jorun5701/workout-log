<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15181d"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>WORKOUT LOG</title><style>*{box-sizing:border-box}body{background:#15181d;color:#f4f5f6;font:16px system-ui;margin:auto;max-width:600px;padding:max(24px,env(safe-area-inset-top)) 18px 100px}small,p{color:#a8afb9}h1{letter-spacing:2px;font-size:26px}h2{font-size:20px}section{background:#242931;border-radius:18px;padding:18px;margin:14px 0}button,input,select{font:inherit;color:inherit;background:#343b45;border:0;border-radius:9px;padding:10px}button{cursor:pointer}button.active{background:#b9ee72;color:#15181d}nav{position:fixed;bottom:0;left:0;right:0;background:#242931;display:flex;justify-content:center;gap:12px;padding:14px 10px max(14px,env(safe-area-inset-bottom))}label{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #39404a}input[type=checkbox]{accent-color:#b9ee72;width:22px;height:22px}progress{width:100%;accent-color:#b9ee72;height:13px}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.grid button{padding:10px 0;min-height:48px}.grid small{display:block;font-size:10px}.done{border:1px solid #b9ee72;color:#b9ee72}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.accent{color:#b9ee72;font-size:36px;font-weight:bold}input[type=text]{min-width:0;flex:1} .muted{opacity:.65}</style><body><small>PERSONAL TRAINING · V0.2</small><h1>WORKOUT LOG</h1><small>초기 4주 · 통증 없는 범위에서 진행</small><main id="main"></main><nav><button onclick="page='home';render()">오늘의 운동</button><button onclick="page='history';render()">운동 기록</button><button onclick="page='plan';render()">계획 수정</button></nav><script>
const $=id=>document.getElementById(id), names=['월','화','수','목','금','토','일'];const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`, parse=s=>new Date(s+'T12:00:00'),idx=d=>(d.getDay()+6)%7,add=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);let state;try{state=JSON.parse(localStorage.getItem('workout-v2'))}catch{};state=state||{plan:[["오픈북 · 좌우 10회 × 2세트", "캣카우 · 10회 × 2세트", "편측 전거근 펀치 · 좌우 12회 × 2세트", "월 슬라이드 · 10회 × 2세트", "네발기기 견갑골 푸쉬업 · 10회 × 2세트", "인클라인 푸쉬업 · 8회 × 2세트"], ["오픈북 · 좌우 10회 × 2세트", "캣카우 · 10회 × 2세트", "원암 덤벨 로우 · 좌우 10–12회 × 2세트", "밴드 랫풀다운 · 12–15회 × 2세트", "빠른 걷기 · 30–40분"], ["오픈북 · 좌우 10회 × 2세트", "캣카우 · 10회 × 2세트", "편측 전거근 펀치 · 좌우 12회 × 2세트", "월 슬라이드 · 10회 × 2세트", "네발기기 견갑골 푸쉬업 · 10회 × 2세트", "인클라인 푸쉬업 · 8회 × 2세트", "고블릿 스쿼트 · 10–12회 × 2세트", "덤벨 RDL · 10–12회 × 2세트", "불가리안 스플릿 스쿼트 · 좌우 8–10회 × 1–2세트", "밴드 레그컬 · 12–15회 × 1–2세트", "카프레이즈 · 15–20회 × 2세트"], ["빠른 걷기 · 30–40분"], ["오픈북 · 좌우 10회 × 2세트", "캣카우 · 10회 × 2세트", "편측 전거근 펀치 · 좌우 12회 × 2세트", "월 슬라이드 · 10회 × 2세트", "네발기기 견갑골 푸쉬업 · 10회 × 2세트", "인클라인 푸쉬업 · 8회 × 2세트", "풀업 · 4–8회 × 2세트", "밴드 랫풀다운 · 12–15회 × 2세트", "페이스풀 · 12–15회 × 1세트"], ["오픈북 · 좌우 10회 × 2세트", "캣카우 · 10회 × 2세트", "빠른 걷기 · 30–40분"], []],logs:{}};let page='home',selected=key(new Date()),month=new Date(),mode='month',editDay=0;function save(){try{localStorage.setItem('workout-v2',JSON.stringify(state))}catch{alert('저장할 수 없습니다. 백업을 내보내 주세요.')}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function items(k){return state.logs[k]||state.plan[idx(parse(k))].map(name=>({name,done:false}))}function toggle(k,i,v){state.logs[k]=items(k).map(x=>({...x}));state.logs[k][i].done=v;save();render()}function detail(k){let a=items(k);return `<h2>${k} · ${names[idx(parse(k))]}요일</h2>${a.length?a.map((x,i)=>`<label><input type="checkbox" ${x.done?'checked':''} onchange="toggle('${k}',${i},this.checked)"><span style="${x.done?'text-decoration:line-through;color:#b9ee72':''}">${esc(x.name)}</span></label>`).join(''):'<p>휴식일입니다.</p>'}`}function selectDay(k){selected=k;render()}function render(){let today=new Date(),start=add(parse(selected),-idx(parse(selected))),days=Array.from({length:7},(_,i)=>key(add(start,i)));let html='';if(page==='home'){let all=days.flatMap(items),n=all.filter(x=>x.done).length,p=all.length?Math.round(n/all.length*100):0;html=`<section><small>주간 달성률 · ${days[0]} — ${days[6]}</small><div class="accent">${p}%</div><progress max="100" value="${p}"></progress><p>${n} / ${all.length}개 운동 완료</p></section><div class="row"><button onclick="shiftWeek(-7)">‹</button><button onclick="selected=key(new Date());render()">오늘</button><button onclick="shiftWeek(7)">›</button></div><section class="grid">${days.map((k,i)=>`<button class="${selected===k?'active':''}" onclick="selectDay('${k}')">${names[i]}<small>${parse(k).getDate()}일</small></button>`).join('')}</section><section>${detail(selected)}</section>`}else if(page==='history'){let y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1),len=new Date(y,m+1,0).getDate();let entries=Object.entries(state.logs).filter(([k,a])=>k.startsWith(mode==='year'?String(y):`${y}-${String(m+1).padStart(2,'0')}`)&&a.some(x=>x.done));html=`<div class="row"><button class="${mode==='month'?'active':''}" onclick="mode='month';render()">월별</button><button class="${mode==='year'?'active':''}" onclick="mode='year';render()">연도별</button></div><section><div class="row"><button onclick="move(-1)">‹</button><h2>${y}년 ${mode==='month'?(m+1)+'월':''}</h2><button onclick="move(1)">›</button></div><p>운동한 날 ${entries.length}일 · 완료 ${entries.reduce((n,[k,a])=>n+a.filter(x=>x.done).length,0)}개</p>${mode==='month'?`<div class="grid">${names.map(n=>`<small>${n}</small>`).join('')}${'<span></span>'.repeat(idx(first))}${Array.from({length:len},(_,i)=>{let k=key(new Date(y,m,i+1)),n=(state.logs[k]||[]).filter(x=>x.done).length;return `<button class="${n?'done':''} ${selected===k?'active':''}" onclick="selectDay('${k}')">${i+1}<small>${n?n+'개':'·'}</small></button>`}).join('')}</div>`:`<div class="grid" style="grid-template-columns:repeat(3,1fr)">${Array.from({length:12},(_,i)=>`<button onclick="month=new Date(${y},${i},1);mode='month';render()">${i+1}월<small>${entries.filter(([k])=>parse(k).getMonth()===i).length}일</small></button>`).join('')}</div>`}</section>${mode==='month'?`<section><h2>${selected} 기록</h2>${(state.logs[selected]||[]).filter(x=>x.done).map(x=>`<p>✓ ${esc(x.name)}</p>`).join('')||'<p>완료한 운동 기록이 없습니다.</p>'}</section>`:''}<section><h2>기록 백업</h2><button onclick="backup()">JSON 내보내기</button> <button onclick="$('restore').click()">불러오기</button><input hidden type="file" id="restore" accept=".json" onchange="restore(this)"></section>`}else{html=`<p>요일별 기본 계획을 수정합니다. 이미 체크한 날짜의 기록은 유지됩니다.</p><div class="grid">${names.map((n,i)=>`<button class="${editDay===i?'active':''}" onclick="editDay=${i};render()">${n}</button>`).join('')}</div><section><h2>${names[editDay]}요일 계획</h2>${state.plan[editDay].map((n,i)=>`<label><span style="flex:1">${esc(n)}</span><button onclick="removeItem(${i})">삭제</button></label>`).join('')}<form class="row" style="margin-top:16px" onsubmit="event.preventDefault();addItem()"><input id="newItem" type="text" required placeholder="운동 이름"><button>추가</button></form></section><small>기존 상담의 운동 처방을 바탕으로 재구성한 초기 계획입니다. 통증이 발생하면 해당 운동을 중단하세요.</small>`}$('main').innerHTML=html;document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('active',['home','history','plan'][i]===page))}function shiftWeek(n){selected=key(add(parse(selected),n));render()}function move(n){month=new Date(month.getFullYear()+(mode==='year'?n:0),month.getMonth()+(mode==='month'?n:0),1);selected=key(month);render()}function addItem(){let v=$('newItem').value.trim();if(v){state.plan[editDay].push(v);save();render()}}function removeItem(i){state.plan[editDay].splice(i,1);save();render()}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='workout-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restore(input){try{let s=JSON.parse(await input.files[0].text());if(!Array.isArray(s.plan)||s.plan.length!==7||!s.plan.every(a=>Array.isArray(a)&&a.every(x=>typeof x==='string'))||!s.logs||!Object.values(s.logs).every(a=>Array.isArray(a)&&a.every(x=>typeof x.name==='string'&&typeof x.done==='boolean')))throw Error();if(confirm('현재 기록을 백업 파일로 바꾸시겠습니까?')){state=s;save();render()}}catch{alert('유효한 백업 파일이 아닙니다.')}}render();if("serviceWorker" in navigator && location.protocol.startsWith("http")){navigator.serviceWorker.register("./sw.js").catch(console.warn)}</script></body></html>
